name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Allow the docker-publish + release workflows to gate on this CI by calling it
  # (`jobs.ci: uses: ./.github/workflows/ci.yml`). Without this the caller fails
  # at 0s with "workflow does not have on.workflow_call".
  workflow_call:

permissions:
  contents: read

env:
  # The SQL test runner, pinned; its haybarn 2.0 community `vgi` extension speaks
  # the worker's VGI protocol (vgi.v3).
  HAYBARN_VERSION: "2.0.1rc3"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -q

  # test/sql/*.test through DuckDB (the haybarn-unittest runner + the signed
  # community `vgi` extension) over every transport, via ci/run-integration.sh —
  # the same script `make test-sql` runs.
  integration:
    name: SQL E2E (${{ matrix.transport }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # launch: DuckDB starts the worker once on an AF_UNIX socket and pools it.
        transport: [stdio, launch, http]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - name: Build the worker
        run: uv sync --locked --all-extras
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          export WORKER="$PWD/.venv/bin/vgi-pe-worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy vgi_pe/

      - name: Docstring lint (pydoclint)
        run: uvx pydoclint --config pyproject.toml vgi_pe/

  # Metadata-quality gate: build the worker, then run the vgi-lint catalog
  # linter against the live `uv run pe_worker.py` LOCATION (the same LOCATION
  # DuckDB ATTACHes) and fail on any finding (info and up). The action installs
  # the signed vgi community extension itself. Kept a separate job so the catalog
  # quality score is visible. VGI305 on `pe.main.strings` is suppressed via
  # [tool.vgi-lint-check] in pyproject.toml (a DuckDB reporting limitation for
  # overloaded table functions — see the comment there).
  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install the worker (from the lockfile, with the http extra)
        run: uv sync --frozen --python 3.14 --extra http

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          location: "uv run --no-sync --python 3.14 ${{ github.workspace }}/pe_worker.py"
          fail-on: info
