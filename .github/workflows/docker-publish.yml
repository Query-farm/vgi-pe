# Copyright 2026 Query Farm LLC - https://query.farm
#
# Build + publish the multi-arch vgi-pe image to ghcr.io. The heavy lifting
# (multi-arch build -> /health smoke -> image SQL test -> push-by-digest -> manifest ->
# cosign-sign) lives in the shared reusable workflow Query-farm/vgi-actions/docker-publish.yml;
# this file gates on the repo's own CI and supplies the worker-specific inputs.
#
# Tag-driven: vX.Y.Z -> :X.Y.Z / :X.Y / :latest; push to release tags only (no :edge image on pushes to main).
name: Publish image to ghcr.io

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate every image on the full unit + vgi-extension integration suite, so a
  # broken worker is never imaged.
  ci-status:
    # A release tag usually points at a commit whose push to main already passed CI.
    # Reuse that result instead of running the whole CI matrix again; otherwise run CI below.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq .total_count || echo 0)
          echo "ci.yml successes for ${GITHUB_SHA}: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: [ci-status]
    if: ${{ needs.ci-status.outputs.passed != 'true' }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci-status, ci]
    if: ${{ !cancelled() && needs.ci-status.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/docker-publish.yml@v1
    secrets: inherit
    with:
      image_name: vgi-pe
      smoke_import: "vgi_pe, lief, pyarrow"
      health_port: "8000"
      version_check_cmd: "ci/check-version.sh"
      # Validate the built image's two transports against the signed vgi
      # extension. The worker logic over every transport is already exercised on
      # every run by the gating `ci` job (all test/sql/*, three transports, two
      # OSes), so we don't re-run the whole matrix cold here:
      #   - stdio: smoke ONE file (one cold container) to prove the stdio
      #     entrypoint speaks the protocol in-image;
      #   - HTTP: run the FULL suite against a SINGLE warm container (end-to-end
      #     image check, no per-ATTACH startup). The container bakes the fixtures
      #     in at /app/test/sql/data so the relative paths resolve worker-side.
      # $CITEST_IMAGE is the loaded <image>:citest-amd64 ref; the runner is the
      # pinned haybarn-unittest from ci.yml's HAYBARN_VERSION.
      image_test: |
        _t0=$(date +%s)
        echo "::group::image + runner facts"
        docker image inspect "$CITEST_IMAGE" --format 'image size: {{.Size}} bytes  arch: {{.Architecture}}' || true
        echo "runner: $(nproc) cpus"; free -h 2>/dev/null || true
        echo "::endgroup::"

        echo "::group::install haybarn-unittest (pinned)"
        # The same runner version ci.yml's integration job pins (HAYBARN_VERSION
        # there is the single source; a reusable workflow can't see caller env).
        HAYBARN_VERSION=$(sed -n 's/^  HAYBARN_VERSION: "\(.*\)"$/\1/p' .github/workflows/ci.yml)
        [ -n "$HAYBARN_VERSION" ] || { echo "::error::HAYBARN_VERSION not found in ci.yml"; exit 1; }
        command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | sh; export PATH="$HOME/.local/bin:$PATH"; }
        uv venv -q .tools && uv pip install -q -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
        export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
        echo "::endgroup::"
        T_HB=$(date +%s)

        echo "::group::stdio entrypoint smoke (one cold container, one file)"
        TRANSPORT=stdio \
          TEST_PATTERN="test/sql/format.test" \
          WORKER="docker run -i --rm $CITEST_IMAGE stdio" \
          ci/run-integration.sh
        echo "::endgroup::"
        T_STDIO=$(date +%s)

        echo "::group::full SQL suite — HTTP transport (one warm container)"
        CID=$(docker run -d -p 8000:8000 "$CITEST_IMAGE")
        trap 'docker rm -f "$CID" >/dev/null 2>&1' EXIT
        for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8000/health && break; sleep 1; done
        T_READY=$(date +%s)
        TRANSPORT=http WORKER_URL="http://localhost:8000" ci/run-integration.sh
        echo "::endgroup::"
        T_HTTP=$(date +%s)

        # Per-phase breakdown -> job summary (and stdout) so slow phases are obvious.
        {
          echo "### Image test timing — $CITEST_IMAGE"
          echo ""
          echo "| phase | seconds |"
          echo "| --- | ---: |"
          echo "| install haybarn-unittest | $((T_HB - _t0)) |"
          echo "| stdio entrypoint smoke (1 cold container) | $((T_STDIO - T_HB)) |"
          echo "| http container ready | $((T_READY - T_STDIO)) |"
          echo "| full suite over HTTP (1 warm container) | $((T_HTTP - T_READY)) |"
          echo "| **total** | $((T_HTTP - _t0)) |"
        } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
